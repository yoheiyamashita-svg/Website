<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ZeroPlus Gate | Profile</title>
    <meta name="description" content="プロフィールサイトを通してHTMLとCSSの基本を身につけましょう">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <!--
        h: 見出し block

        p: 段落 block

        div: グループ化 block

        img: 画像 inline

        section: 章 block

        foooter: フッター block

        small: 文字小さく inline
    -->

    <!--
        background-color: 背景色

        font-family: フォントの書体

        font-size: フォントの大きさ

        font-weight: フォントの太さ

        margin: 要素の外側の余白

        padding: 要素の内側の余白

        text-align: ブロック要素の水平方向の配置

        width: 要素の横幅
    -->
    <div class="wrapper">
        <h1 class="name">山田 花子</h1>
        
        <div class="container">
            <div class="profile-img">
                <img src="img/profile.jpg" alt="山田花子の写真">
            </div>
            <section class="section-wrap">
                <h2 class="section-ttl">プロフィール</h2>
                <p>生年月日：　1988.2.26</p>
                <p>出身：　アメリカ in ニューヨーク</p>
                <p>趣味：　カメラ撮影/絵を描くこと</p>
                <p>好きな言葉；　freedom of choice for everyone</p>
            </section>
        </div>
    </div>
</body>
</html>
